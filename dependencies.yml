# dependencies.yml — THE single structured source for the script -> output-file graph.
# (Was the machine tables in component-dependency-map.md §3.1/§4; that doc now holds only
#  the human design rationale and points here.) Each entry: a script and the files it WRITES.
# VALIDATED by lint.py (deps_valid): every script + output path must exist, and each script
# must actually reference each output's basename — so this map can't silently drift. The
# missing-cascade check CONSUMES it: a changed constant -> grep its consuming scripts -> the
# outputs those scripts write -> were they regenerated + staged?  Flow style ([..]/{..}) so the
# dependency-free reader in deps.py stays tiny. Add an entry when a generator/model is added.

# 2D diagram generators -> the PNG(s) each writes (under diagrams/).
generators:
  assembly_fabrication: {script: src/generators/generate_assembly_fabrication.py, outputs: [diagrams/assembly-fab-sheet1.png, diagrams/assembly-fab-sheet2.png]}
  assembly_overview: {script: src/generators/generate_assembly_overview.py, outputs: [diagrams/assembly-overview-fp.png, diagrams/assembly-overview-plan.png, diagrams/assembly-overview.png]}
  electrical_diagram: {script: src/generators/generate_electrical_diagram.py, outputs: [diagrams/electrical-sheet1.png, diagrams/electrical-sheet2.png, diagrams/electrical-sheet3.png, diagrams/electrical-sheet4.png, diagrams/electrical-sheet5.png, diagrams/electrical-sheet6.png]}
  film_plane_distortion: {script: src/generators/generate_film_plane_distortion.py, outputs: [diagrams/film-plane-distortion-summary.png]}
