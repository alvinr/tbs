  lighttrap_diagram: {script: src/generators/generate_lighttrap_diagram.py, outputs: [diagrams/lighttrap-sheet1.png, diagrams/lighttrap-sheet2.png]}
  line_of_sight: {script: src/generators/generate_line_of_sight.py, outputs: [diagrams/line-of-sight.png]}
  mini_tbs_diagram: {script: src/generators/generate_mini_tbs_diagram.py, outputs: [diagrams/mini-tbs-sheet1.png]}
  panel_layout: {script: src/generators/generate_panel_layout.py, outputs: [diagrams/panel-layout.png, diagrams/panel-layout-back.png]}
  pinhole_wall_elevation: {script: src/generators/generate_pinhole_wall_elevation.py, outputs: [diagrams/pinhole-wall-elevation.png]}
  plate_drawing: {script: src/generators/generate_plate_drawing.py, outputs: [diagrams/plate-drawing-sheet1.png, diagrams/plate-drawing-sheet2.png]}
  portrait_viz: {script: src/generators/generate_portrait_viz.py, outputs: [diagrams/portrait-camera-schematic.png, diagrams/portrait-optimal-3m.png, diagrams/portrait-scale-comparison.png]}
  schematic: {script: src/generators/generate_schematic.py, outputs: [diagrams/portrait-camera-schematic.png]}
  shelf_diagram: {script: src/generators/generate_shelf_diagram.py, outputs: [diagrams/shelf-sheet1.png, diagrams/shelf-sheet2.png, diagrams/shelf-sheet3.png]}
  spray_bar_diagram: {script: src/generators/generate_spray_bar_diagram.py, outputs: [diagrams/spray-bar-sheet1.png]}
  tilt_swing_diagram: {script: src/generators/generate_tilt_swing_diagram.py, outputs: [diagrams/tilt-swing-sheet1.png, diagrams/tilt-swing-sheet2.png]}
  walkway_diagram: {script: src/generators/generate_walkway_diagram.py, outputs: [diagrams/walkway-sheet1.png, diagrams/walkway-sheet2.png, diagrams/walkway-sheet3.png, diagrams/walkway-sheet4.png, diagrams/walkway-sheet5.png, diagrams/walkway-sheet6.png, diagrams/walkway-sheet7.png, diagrams/walkway-sheet8.png, diagrams/walkway-sheet9.png]}
  weight_analysis: {script: src/generators/generate_weight_analysis.py, outputs: [diagrams/weight-analysis-sheet1.png, diagrams/weight-analysis-sheet2.png, diagrams/weight-analysis-sheet3.png, diagrams/weight-analysis-sheet4.png, diagrams/weight-analysis-sheet5.png]}

# SketchUp 3D models -> script + outputs (.skp built in-app via --send/save; .rb via --save).
models:
  overview: {script: src/models/generate_sketchup_model.py, outputs: [models/overview.skp, src/models/overview.rb]}
  spraybar: {script: src/models/generate_spraybar_model.py, outputs: [models/spraybar.skp, src/models/spraybar.rb]}
  ibc-stack: {script: src/models/generate_ibc_model.py, outputs: [models/ibc-stack.skp, src/models/ibc-stack.rb]}
  walkway: {script: src/models/generate_walkway_model.py, outputs: [models/walkway.skp, src/models/walkway.rb]}
  film-plane: {script: src/models/generate_film_plane_model.py, outputs: [models/film-plane.skp, src/models/film-plane.rb]}
  lighttrap: {script: src/models/generate_lighttrap_model.py, outputs: [models/lighttrap.skp, src/models/lighttrap.rb]}
  electrical: {script: src/models/generate_electrical_model.py, outputs: [models/electrical.skp, src/models/electrical.rb]}
  # water = the combined wet-end + IBC plumbing corridor (both plumbing panels). massing_pinhole_wall.py
  # imports massing_corridor_panel.py; built via --send, saved via --save (no .rb). corridor-panel.skp
  # is a scratch standalone corridor view (gitignored) — water.skp is the embedded deliverable.
  water: {script: src/models/massing_pinhole_wall.py, outputs: [models/water.skp]}
