# SketchUp 3D models -> script + outputs + Sketchfab identity + staleness manifest.
#   outputs      : the files the script writes (.skp built in-app via --send/save; .rb via --save).
#                  .rb are NOT tracked in git (gitignored) — the source_hash below is their stand-in.
#   uid          : stable Sketchfab model UID (re-uploads REPLACE this model). THE single home —
#                  generators read it from here (ov.model_uid), push_sketchfab.py reads/rewrites it.
#   embed_files  : the doc(s) whose iframe embeds this model (push tool rewrites the uid there on a push).
#   source_hash  : sha256 of the model's regenerated, identity-stripped .rb — the drift tripwire that
#                  replaced the committed .rb. `lint.py --verify-all` recomputes + compares; a mismatch
#                  means the .skp is stale vs source (regenerate + re-send). `manifest.py --update` refreshes.
models:
  overview: {script: src/models/generate_sketchup_model.py, outputs: [models/overview.skp, src/models/overview.rb], uid: e624e210bf3d4de08b1a7b7261a66c45, embed_files: [project-summary.md], source_hash: "sha256:0bc88b90b90ab60f6ad45042a6fd1de40c4752c78ed584c1bc11f5cad17bf8c3"}
  spraybar: {script: src/models/generate_spraybar_model.py, outputs: [models/spraybar.skp, src/models/spraybar.rb], uid: 18fb381fbf48459cac25dcaa23958387, embed_files: [processing-tray-and-spray-bar.md], source_hash: "sha256:5a56265b1fdfd549bc0170eb7062c7d5bf2b86206991f2e2a704e4367f8e81fa"}
  ibc-stack: {script: src/models/generate_ibc_model.py, outputs: [models/ibc-stack.skp, src/models/ibc-stack.rb], uid: 8d091c60e93848f38e26c9c89a08cbc8, embed_files: [ibc-stacking-report.md], source_hash: "sha256:34bc307bed768cc8148c0a746eb23c23d10d882d4a01904f472d624f3ae9399f"}
