  ibc_frame_drawing: {script: src/generators/generate_ibc_frame_drawing.py, outputs: [diagrams/ibc-frame-sheet1.png, diagrams/ibc-frame-sheet2.png, diagrams/ibc-frame-sheet3.png]}
