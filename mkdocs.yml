site_name: "The Big Shoebox — Research & Build"
site_description: "A rigorous, source-backed design and build guide for a 20 ft × 7 ft pinhole camera."
site_url: "https://alvinr.github.io/tbs"

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/favicon.png
  palette:
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - "Proposal": funding-proposal.md
  - "Cost Breakdown": project-cost-breakdown.md
  - "Optics Report": pinhole-optics-report.md
  - "Container Optics": pinhole-option-b-optics.md
  - "Lens vs Pinhole": lens-vs-pinhole-exposure.md
  - "Lens Options": lens-options.md
  - "Transportation": container-transport-options.md
  - "Pinhole Fab": fabrication-drawings.md
  - "Photosensitive Materials": photosensitive-plane-options.md
  - "Processing System": water-system-report.md
  - "Film Plane Mechanism": film-plane-mechanism-report.md
  - "Tilt-Swing Front Board": tilt-swing-board-report.md
  - "Construction Guide": pinhole-camera-construction.md
  - "Chem Shopping List": chemistry-shopping-list.md
  - "Operating Manual": operating-manual.md
  - "Electrical & Systems": electrical-report.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/tbs

copyright: "The Big Shoebox Project (c) 2026 Alvin Richards"
