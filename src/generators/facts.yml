# facts.yml — registry of cross-referenced NUMBERS restated across the MD docs, + the regexes that
# police them. Phase 2 of drift-reduction-plan.md. This is NOT where values are USED (code computes
# with those); it is where the linter learns "this number is repeated in prose, here's how to spot
# it, here's what it must equal." facts.py loads it with a tiny dependency-free YAML reader (PyYAML
# isn't installed, and the pre-commit hook must stay dependency-free).
#
# WHERE DOES A NUMBER LIVE? (one home per value — this is what keeps the three stores from drifting)
#   Does code compute / draw / build with it?
#     • yes, geometry/engineering        -> tbs_constants.py   (e.g. RAIL_X_L, MAX_TILT_DEG)
#     • yes, it's money                  -> costing.py         (line items + summed totals)
#     • no, it only appears in prose but is restated across docs and you want it policed -> here:
#         - it IS also a code value  -> `constant:` REFERENCE (no copy; reads from tbs_constants)
#         - it lives nowhere in code -> `value:` literal  (the ONLY case facts.yml is itself a source)
#   Rules that keep this from becoming a 2nd drift vector:
#     1. DEFAULT to `constant:`. Reach for a literal `value:` only when the number has no code home —
#        and prefer making it a COMPUTED constant first (see prints_per_resupply: derived, then
#        referenced) so even the literal disappears.
#     2. NEVER put a cost here — costs live in costing.py.
#     3. tbs_constants must never import from facts — the dependency points one way (facts ->
#        constants), so constants stay the root.
#
# Each fact:
#   value     — a literal canonical value (last resort: no code home), OR
#   constant  — a tbs_constants name to read it FROM (preferred — registry can't disagree with code)
#   unit, owner — the unit and the one doc that owns/derives the fact
#   aliases   — tight regexes (single-quoted); group(1) captures the value in prose. lint.py
#               flags any doc whose captured value != the canonical value.
# Keep aliases specific (low false-positive). Add a fact when a number gets restated in many docs.

film_plane_max_tilt:
  constant: MAX_TILT_DEG
  unit: deg
  owner: film-plane-mechanism-report.md
  aliases:
    - '±(\d+(?:\.\d+)?)°\s*tilt,\s*±\d+(?:\.\d+)?°\s*swing'
    - '[Ff]ilm plane max tilt\s*\|\s*±(\d+(?:\.\d+)?)°'
    - 'tilt angle[s]?\s*up to\s*±(\d+(?:\.\d+)?)°'

film_plane_max_swing:
  constant: MAX_SWING_DEG
  unit: deg
  owner: film-plane-mechanism-report.md
  aliases:
    - '±\d+(?:\.\d+)?°\s*tilt,\s*±(\d+(?:\.\d+)?)°\s*swing'
    - '[Ff]ilm plane max swing\s*\|\s*±(\d+(?:\.\d+)?)°'
    - 'swing angle[s]?\s*up to\s*±(\d+(?:\.\d+)?)°'

# Prints between resupply — drifted 10 vs 13. Aliases match the OPERATIONAL claim only, not the
# water-report's "8-10 ... on fresh Blue alone" baseline nor "per charge" (battery).
# COMPUTED in tbs_constants (Blue supply / Blue-per-print over the real tray footprint), so this
# REFERENCES the constant rather than restating 13 — the value can't disagree with its derivation.
prints_per_resupply:
  constant: PRINTS_PER_RESUPPLY
  unit: prints
  owner: water-system-report.md
  aliases:
    - '(?:supports|Provides) ~?(\d+)\s+full-size prints'
    - '~?(\d+)\s+prints per resupply'
    - '~(\d+)\s+full prints between resupply'
    - 'Blue tank ≈ (\d+)\s+prints'

# ── Tilt-swing front board envelope (Part 1: promoted to FRONT_BOARD_* constants) ──
# Both angles are COMPUTED in tbs_constants from the arm/travel/screw/detents, so these reference
# the constant. Aliases anchor on 'tilt and swing' / 'per click' so they don't catch the ±5°
# approximations (e.g. 'every 5° of board tilt') or the 5° bellows-compression note.
front_board_max_deg:
  constant: FRONT_BOARD_MAX_DEG
  unit: deg
  owner: tilt-swing-board-report.md
  aliases:
    - '[Tt]ilt and [Ss]wing \(±(\d+(?:\.\d+)?)°\)'
    - '±(\d+(?:\.\d+)?)°\s*tilt and swing'
    - 'pivot up to ±(\d+(?:\.\d+)?)°'
    - '[Tt]ilt.swing board max\s*\|?\s*±(\d+(?:\.\d+)?)°'

front_board_click_deg:
  constant: FRONT_BOARD_CLICK_DEG
  unit: deg
  owner: tilt-swing-board-report.md
  aliases:
    - '(\d+\.\d+)°\s*per click'
    - '(\d+\.\d+)°/click'

# Max image shift at the ±5.3° hard stop = C_WID·tan(FRONT_BOARD_MAX_DEG). INJECTION-ONLY
# (a bare 3-digit value that recurs as the 5° reference 207 / other dims; aliases would over-match).
front_board_max_shift_mm:
  constant: FRONT_BOARD_MAX_SHIFT_MM
  unit: mm
  owner: tilt-swing-board-report.md

# Hinged-panel transport swing angle — SWING_LOCK_DEG; restated across the hinged-panel report.
# INJECTION-ONLY (56 is a bare 2-digit value that recurs in other contexts).
panel_swing_deg:
  constant: SWING_LOCK_DEG
  unit: deg
  owner: hinged-panel-report.md

# ── Optical constants (Part 2: restated across many docs; each already owned by tbs_constants) ──
pinhole_diameter_mm:
  constant: PH_D
  unit: mm
  owner: pinhole-optics-report.md
  aliases:
    - '[Pp]inhole \((\d\.\d+)\s*mm'
    - 'Ø(\d\.\d+)\s*mm \([Rr]ayleigh'
    - '[Pp]inhole\s*\|\s*Ø(\d\.\d+)\s*mm'

# NB: f-number and focal length appear in MANY comparison/alternative contexts (other pinhole sizes,
# lens options), so a value-equality check must anchor ONLY to the CANONICAL statement — the spec-table
# row and the one prose phrasing — never a bare 'f/NNNN' or 'NNNN mm'.
f_number:
  constant: PH_FNO
  unit: f-number
  owner: pinhole-optics-report.md
  aliases:
    - '\| f.number \| f/(\d+)'
    - 'an f.number of f/(\d+)'

focal_length_mm:
  constant: PH_F
  unit: mm
  owner: pinhole-optics-report.md
  display: comma
  aliases:
    - '\| [Ff]ocal length \| ~?(\d[\d,]{3,})\s*mm'

film_plane_width_mm:
  constant: FP_W
  unit: mm
  owner: film-plane-mechanism-report.md
  display: comma
  aliases:
    - 'active[^0-9]{0,6}(\d[\d,]{3,})\s*×\s*2,?388'
    - '[Ii]mage plane.{0,18}(\d[\d,]{3,})\s*×\s*2,?388'

# Film-plane height — INJECTION-ONLY (no aliases): 2388 also equals the container height C_HGT, so a
# value-equality alias-scan would false-positive. Used to FILL the '× 2388' placeholder in the
# film-zone dimension (the injector doesn't need an alias).
film_plane_height_mm:
  constant: FP_H
  unit: mm
  owner: film-plane-mechanism-report.md
  display: comma

# Pre-cut muslin sheet = image plane + 100mm hem/edge. INJECTION-ONLY (no aliases): the width 4699 is
# distinctive but only restated in op-manual 0.4.7, filled via placeholder there.
muslin_cut_w_mm:
  constant: MUSLIN_CUT_W
  unit: mm
  owner: operating-manual.md
  display: comma
muslin_cut_h_mm:
  constant: MUSLIN_CUT_H
  unit: mm
  owner: operating-manual.md
  display: comma
muslin_hem_mm:
  constant: MUSLIN_HEM
  unit: mm
  owner: operating-manual.md
  display: plain

# Container interior — INJECTION-ONLY (no aliases): 2388 also = film-plane/container height, 5893
# appears in comparison contexts, and 2362 (width) ALSO equals the focal length (the optical axis runs
# across the container's short dimension), so they're filled only where a placeholder marks the meaning.
container_interior_length_mm:
  constant: C_LEN
  unit: mm
  owner: container-report.md
  display: comma

container_height_mm:
  constant: C_HGT
  unit: mm
  owner: container-report.md
  display: comma

# Container interior WIDTH — C_WID, which is the SAME constant the focal length derives from
# (PH_F = C_WID). This fact gives the *width* sense its own placeholder so structural uses (walkway
# beams, far-wall Yd) don't have to borrow focal_length_mm. INJECTION-ONLY (2362 = focal length too).
container_width_mm:
  constant: C_WID
  unit: mm
  owner: container-report.md
  display: comma

# Film-plane / pinhole X coordinates — INJECTION-ONLY (no aliases): these system-defining
# X positions (CLAUDE.md Key Optical Constants) are computed in tbs_constants, but the bare
# values (150, 2399, 4649) also appear in many unrelated contexts (150mm plates, slit center
# ≈2399, zone X=4649–5893), so they're filled only where a placeholder marks the meaning.
pinhole_x_mm:
  constant: PH_X
  unit: mm
  owner: pinhole-optics-report.md
  display: comma

film_plane_left_x_mm:
  constant: FP_X_L
  unit: mm
  owner: film-plane-mechanism-report.md

film_plane_right_x_mm:
  constant: FP_X_R
  unit: mm
  owner: film-plane-mechanism-report.md
  display: comma

# Spray-bar beam span — derived (WALKWAY_RIGHT_X − near-walkway start); owned by the
# processing-tray report. INJECTION-ONLY.
spray_beam_span_mm:
  constant: SPRAY_BEAM_SPAN
  unit: mm
  owner: processing-tray-and-spray-bar.md
  display: comma

# Evaporative-cooler rated airflow — Hessaire MC18M spec, restated in ventilation §5.1/§9/§11.
# INJECTION-ONLY (no aliases): 200/300/400 CFM also appear for the fans/duct, so a CFM-value
# alias would false-positive; filled only where a placeholder marks the cooler rating.
cooler_cfm_rated:
  constant: EVAP_CFM_RATED
  unit: CFM
  owner: ventilation-report.md
  display: comma

blue_supply_l:
  constant: BLUE_SUPPLY_L
  unit: L
  owner: water-system-report.md
  display: comma                       # fills as '1,800' (with thousands separator) when injected
  aliases:
    - '(\d,?\d{3})\s*L\s*Blue'
    - '(\d,?\d{3})\s*L \(476 gal\)'

# ── Derived display figures (computed from their inputs; aliases anchor on the shift/area context
# so they don't catch other mm values or the '116 kg' tray weight) ──
# NB: 'shift (Nmm)' and a bare 'N sq ft' both catch OTHER values (other tilt configs, wall/coating
# areas) — anchor strictly to the per-5° image-shift and the image-plane area.
image_shift_per_5deg:
  constant: IMAGE_SHIFT_PER_5DEG
  unit: mm
  owner: tilt-swing-board-report.md
  aliases:
    - 'tan\(5°\)\s*=\s*(\d+)\s*mm'
    - '(\d+)\s*mm per 5°'
    - '(\d+)\s*mm of image shift'
    - 'projected image (\d+)\s*mm'
    - '\| 5° \| (\d+)mm'

image_area_sqft:
  constant: IMAGE_AREA_SQFT
  unit: sqft
  owner: project-summary.md
  aliases:
    - '[Ii]mage area\s*\|\s*~?(\d+)\s*sq ft'
    - '~?(\d+)\s*sq ft each'
    - '~?(\d+)\s*sq ft \(active'
    - '~?(\d+)\s*sq ft active'
    - '(\d+)\s*sq ft image plane'

# Transport swung-panel clearance to the closed door plane — COMPUTED from the swing geometry
# (was hardcoded +59 in labels + ~8 docs). Anchored to the "+NNmm" clearance phrasings so a
# coincidental 59 elsewhere isn't policed.
swung_door_clearance_mm:
  constant: SWUNG_DOOR_CLEARANCE_MM
  unit: mm
  owner: hinged-panel-report.md
  aliases:
    - 'true min X \+(\d+)\s?mm'
    - '\+(\d+)\s?mm \(true min X'
    - '\(clear \+(\d+)\s?mm\)'
    - '\(door clears? \+(\d+)\s?mm\)'
    - '(?:swung frame|door plane) by \+(\d+)\s?mm'
    - 'closed door is \+(\d+)\s?mm'

# Evaporative cooler (Circuit E) power — 85W AC datasheet draw; 97W = 85 ÷ 0.88 on the 12V bus.
# Anchored to the cooler-power phrasings so a coincidental 85/97 elsewhere isn't policed.
evap_cooler_w_ac:
  constant: EVAP_COOLER_W_AC
  unit: W
  owner: ventilation-report.md
  aliases:
    - '(\d+) ?W AC'
    - 'AC,? (\d+) ?W'
    - '(\d+) ?W, (?:16 lb|1,?300 CFM)'
evap_cooler_w_bus:
  constant: EVAP_COOLER_W_BUS
  unit: W
  owner: electrical-report.md
  aliases:
    - '(\d+) ?W on (?:the )?(?:12 ?V )?bus'
    - '~?(\d+) ?W on the 12'
    - '~(\d+) ?W vs the old'

# IBC direct-stack ceiling headroom — COMPUTED (C_HGT − IBC_H_STK_1000). Anchored to the
# headroom/clearance phrasings so a coincidental 52mm isn't policed. The 'ceiling clearance'
# alias additionally requires a stacking word (stack/tote) in the same sentence, so it can't
# false-match the film-plane top-rail's own '25mm ceiling clearance' (a different measurement).
ibc_ceiling_clearance_mm:
  constant: IBC_CEILING_CLEARANCE_MM
  unit: mm
  owner: ibc-stacking-report.md
  aliases:
    - '(\d+) ?mm (?:of )?(?:ceiling )?headroom'
    - '(?:stack|tote)\w*[^.]*?(\d+) ?mm ceiling clearance'

# Water-balance figures — COMPUTED from BLUE_SUPPLY_L + the per-print loss (water-system §4); a
# supply/print change re-derives them everywhere. Anchored to the recovered/collection/lost/gal
# phrasings (value appears as both L and kg — water is 1:1 — in the water vs weight reports).
blue_supply_gal:
  constant: BLUE_SUPPLY_GAL
  unit: gal
  owner: water-system-report.md
  aliases:
    - '(\d{3})[- ]gallon \(1,800'
    - '(\d{3}) gal / 1,800'
    - '1,800 ?L \((\d{3}) gal\)'
recovered_l:
  constant: RECOVERED_L
  unit: L
  owner: water-system-report.md
  display: comma
  aliases:
    - '~?(\d,?\d{3})\s?(?:L|kg)[^.()]{0,18}recover'
    - 'hold(?:s)? (?:the )?~?(\d,?\d{3})L'
    - '~?(\d,?\d{3})\s?kg of recovered'
collection_fill_l:
  constant: COLLECTION_FILL_L
  unit: L
  owner: water-system-report.md
  aliases:
    - '(\d{3})L each at'
    - '(\d{3})L each for'
    - 'recovered \(~?(\d{3})L each\)'
    - 'two (\d{3})L collection'
lost_l:
  constant: LOST_L
  unit: L
  owner: water-system-report.md
  aliases:
    - 'and ~?(\d{3})\s?L \('
    - '~?(\d{3})\s?(?:L|kg) (?:was |is )?lost'
    - 'other ~?(\d{3})\s?L'

# ── Un-registered-values audit (2026-07-06): system constants restated in prose but previously
#    unpoliced by any fact. Each REFERENCES its tbs_constants owner (can't disagree with code) with a
#    tight alias, so a future drift in the restatement is flagged. ──
corridor_width_mm:
  constant: CORRIDOR_W
  unit: mm
  owner: equipment-layout-report.md
  aliases:
    - '(\d+)\s?mm\s+(?:plumbing\s+)?corridor'

container_rib_spacing_mm:
  constant: CONTAINER_RIB_SPACING
  unit: mm
  owner: container-report.md
  aliases:
    - '[Ee]very\s+(\d+)\s?mm\s*\(18'
    - '(\d+)\s?mm\s+rib\s+cent'

ibc_stack_height_mm:
  constant: IBC_H_STK_1000
  unit: mm
  owner: ibc-stacking-report.md
  aliases:
    - '(\d,?\d{3})\s?mm\s*\(2\s?[×x]\s?1,?168'
    - 'totes reach\s+(\d,?\d{3})\s?mm'

walkway_near_wide_w_mm:
  constant: WALKWAY_NEAR_WIDE_W
  unit: mm
  owner: walkway-report.md
  aliases:
    - 'walkway\S*\s*\((\d+)\s?mm\s+deep'
    - '[Ww]alkway\s*\(widened\)\s*\|\s*(\d+)\s?mm'
    - 'walkway widens to\s*(\d+)\s?mm'
    - 'widened\s+section\s*\|\s*(\d+)\s?mm'

clamp_spacing_mm:
  constant: CLAMP_SPACING
  unit: mm
  owner: film-clamp-mechanism-report.md
  aliases:
    - 'clamps?\s+at\s+(\d+)\s?mm'
    - '(\d+)\s?mm\s+(?:centers|centres|spacing)\s*\(\d+\s+clamps'
